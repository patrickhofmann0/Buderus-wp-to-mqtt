version: 2
updates:
  # Go-Module (go.mod/go.sum)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  # Basis-Images im Dockerfile des Service und des Devcontainers
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # Images in den Compose-Dateien (z. B. Mosquitto)
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # Actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
