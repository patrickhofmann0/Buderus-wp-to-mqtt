quarkus.banner.enabled=false
quarkus.log.level=OFF
quarkus.analytics.disabled=true
quarkus.native.enable-https-url-handler=true
quarkus.native.auto-service-loader-registration=true
quarkus.native.march=compatibility
quarkus.native.resources.includes=META-INF/services/org.eclipse.paho.client.mqttv3.spi.NetworkModuleFactory,org/eclipse/paho/client/mqttv3/internal/nls/**
quarkus.native.additional-build-args=--enable-url-protocols=http\\,https,--initialize-at-run-time=org.eclipse.paho.client.mqttv3.internal.security.SSLSocketFactoryFactory

# Selected only by the REST client when API_INSECURE_SKIP_VERIFY is explicitly enabled.
quarkus.tls.buderus-api-insecure.trust-all=true
quarkus.tls.buderus-api-insecure.hostname-verification-algorithm=NONE

bridge.api-timeout=${API_TIMEOUT:15s}
bridge.api-max-body-bytes=${API_MAX_BODY_BYTES:1048576}
bridge.api-insecure-skip-verify=${API_INSECURE_SKIP_VERIFY:false}
bridge.mqtt-broker=${MQTT_BROKER:tcp://localhost:1883}
bridge.mqtt-client-id=${MQTT_CLIENT_ID:buderus-wp-to-mqtt}
bridge.mqtt-topic=${MQTT_TOPIC:buderus/wp}
bridge.mqtt-qos=${MQTT_QOS:0}
bridge.mqtt-retain=${MQTT_RETAIN:false}
bridge.mqtt-publish-timeout=${MQTT_PUBLISH_TIMEOUT:5s}
bridge.mqtt-availability=${MQTT_AVAILABILITY:true}
bridge.mapping=${MAPPING:fields}
bridge.schedule=${SCHEDULE:@every 60s}
bridge.poll-on-start=${POLL_ON_START:true}
bridge.timezone=${TZ:UTC}
bridge.log-level=${LOG_LEVEL:info}
bridge.log-format=${LOG_FORMAT:json}

# Resolve sensitive values inside the guarded Settings producer, not during eager mapping bootstrap.
bridge-sensitive.api-url=${API_URL:}
bridge-sensitive.api-urls=${API_URLS:}
bridge-sensitive.api-token=${API_TOKEN:}
bridge-sensitive.api-user=${API_USER:}
bridge-sensitive.api-password = ${API_PASSWORD:}
bridge-sensitive.mqtt-user=${MQTT_USER:}
bridge-sensitive.mqtt-password = ${MQTT_PASSWORD:}